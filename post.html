<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Journal · Naina's Beauty n Beyond</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="icon" type="image/png" href="assets/img/logo-badge-64.png">
<link rel="apple-touch-icon" href="assets/img/logo-badge-160.png">
<meta property="og:image" content="assets/img/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..800;1,6..96,400..700&family=Jost:wght@300;400;500;600&display=swap">
<link rel="stylesheet" href="assets/css/site.css">
<style>
  .post-hero { position: relative; min-height: 78svh; display: flex; align-items: flex-end; overflow: hidden; isolation: isolate; }
  .post-hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 25%; z-index: -2; animation: kb 18s ease-out both, focus 1.8s ease-out both; }
  .post-hero::after { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(0deg, var(--ink) 4%, rgba(16,10,14,.6) 40%, rgba(16,10,14,.2) 70%, rgba(16,10,14,.6)); }
  .post-head { padding-block: 120px 50px; display: grid; gap: 16px; }
  .post-head h1 { font-size: clamp(2.3rem, 6vw, 4.6rem); line-height: 1.02; max-width: 18ch; font-style: italic; font-weight: 400; }
  .post-head .lead { color: #e2d4ce; max-width: 54ch; }
  .post-body { max-width: 720px; padding-block: 30px 40px; }
  .article { font-size: 1.1rem; line-height: 1.8; color: #e2d4ce; display: grid; gap: 1.1em; }
  .article > * { margin: 0; }
  .article h2 { font-size: clamp(1.6rem, 3vw, 2.1rem); color: var(--ivory); margin-top: .8em; font-style: italic; }
  .article h3 { font-size: 1.4rem; color: var(--ivory); }
  .article strong { color: var(--gold-hi); font-weight: 500; }
  .article ul, .article ol { padding-left: 1.2em; display: grid; gap: .35em; }
  .article li::marker { color: var(--gold); }
  .article a { color: var(--gold-hi); }
  .article img { border-radius: 4px; }
  .article blockquote { border-left: 2px solid var(--gold); padding-left: 18px; font-family: var(--display); font-style: italic; font-size: 1.4rem; color: var(--ivory); }
  .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; max-width: 1000px; padding-block: 10px 40px; }
  .gallery img { width: 100%; aspect-ratio: 4/5; object-fit: cover; border-radius: 4px; }
  .post-cta { max-width: 720px; padding-block: 30px 90px; display: flex; gap: 14px; flex-wrap: wrap; align-items: center; justify-content: space-between; border-top: 1px solid var(--line); }
  .post-cta h3 { font-size: 1.8rem; font-style: italic; }
  .back { text-decoration: none; font-size: 12px; letter-spacing: .24em; text-transform: uppercase; color: var(--gold); }
  .missing { min-height: 70svh; display: grid; place-content: center; gap: 18px; text-align: center; }
</style>
</head>
<body class="site">
<div class="grain" aria-hidden="true"></div>
<header class="nav solid" id="nav">
  <div class="nav-in">
    <a class="logo" href="index.html"><img class="logo-img" src="assets/img/logo-badge-160.png" alt="" width="40" height="40"><span data-s="brand_name">Naina's</span><small data-s="brand_suffix">Beauty n Beyond</small></a>
    <nav class="links" aria-label="Main"><a href="index.html#work">Work</a><a href="index.html#offers">Offers</a><a href="index.html#journal">Journal</a></nav>
    <a class="btn btn-gold btn-sm" href="index.html#book">Book</a>
  </div>
</header>
<main id="post"></main>
<footer class="foot"><div class="wrap foot-in"><div class="logo"><img class="logo-img" src="assets/img/logo-badge-160.png" alt="" width="40" height="40"><span data-s="brand_name">Naina's</span><small data-s="brand_suffix">Beauty n Beyond</small></div><div class="foot-links"><a href="index.html">Home</a><a href="index.html#book">Book</a></div></div></footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/seed.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/common.js"></script>
<script>
(async function () {
  const { $, esc, md, fmtDate, applySettings, grain } = UI;
  grain();
  async function show() {
    const slug = decodeURIComponent((location.hash || "").slice(1));
    let st, p = null;
    try { st = await Store.settings(); p = slug ? await Store.getPost(slug) : null; }
    catch (e) { console.error(e); st = SEED.settings; p = SEED.posts.find((x) => x.slug === slug) || null; }
    applySettings(st);
    if (!p) {
      $("#post").innerHTML = `<section class="wrap missing"><p class="kicker">Not found</p><h1 class="h2">This post isn't here any more.</h1><a class="btn btn-ghost" href="index.html#journal">Back to the journal</a></section>`;
      return;
    }
    document.title = p.title + " · " + st.brand_name;
    const extra = (p.images || []).filter((u) => u && u !== p.cover);
    $("#post").innerHTML = `
      <section class="post-hero"><img src="${esc(p.cover || (p.images || [])[0] || "")}" alt="">
        <div class="wrap post-head">
          <a class="back" href="index.html#${p.kind === "blog" ? "journal" : "work"}">← ${p.kind === "blog" ? "Journal" : "The Work"}</a>
          <p class="kicker">${esc(fmtDate(p.created_at))}${(p.tags || []).length ? " · " + esc(p.tags.join(" · ")) : ""}</p>
          <h1>${esc(p.title)}</h1>
          ${p.excerpt ? `<p class="lead">${esc(p.excerpt)}</p>` : ""}
          ${p.published === false ? `<p class="badge">Draft · only you can see this</p>` : ""}
        </div>
      </section>
      <article class="wrap post-body"><div class="article">${md(p.body)}</div></article>
      ${extra.length ? `<section class="wrap gallery">${extra.map((u) => `<img src="${esc(u)}" alt="" loading="lazy">`).join("")}</section>` : ""}
      <section class="wrap post-cta"><h3>Love this look?</h3><a class="btn btn-gold" href="index.html#book">Book your look</a></section>`;
    scrollTo(0, 0);
  }
  addEventListener("hashchange", show);
  show();
})();
</script>
</body>
</html>
